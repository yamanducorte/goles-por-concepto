<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C1A0E">
<title>Goles × Concepto · Formativas 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --campo:#0C1A0E; --panel:#122513; --panel2:#173017; --panel3:#1D3A1D;
  --cal:rgba(217,178,60,.16); --cal-fuerte:rgba(217,178,60,.34);
  --tiza:#F5F1E3; --tiza2:#A8B59B; --tiza3:#6E7C63;
  --afavor:#3DC24E; --afavor-dim:#1B4A20; --afavor-txt:#82E28D;
  --encontra:#E8402F; --encontra-dim:#571E17; --encontra-txt:#FF9184;
  --amarillo:#D9B23C; --oro:#D9B23C; --hdr:rgba(12,26,14,.93);
  --cond:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html[data-theme="light"]{
  --campo:#F3F5F0; --panel:#FFFFFF; --panel2:#EDF1E8; --panel3:#E2E9DD;
  --cal:rgba(15,61,29,.14); --cal-fuerte:rgba(15,61,29,.32);
  --tiza:#17211A; --tiza2:#48584A; --tiza3:#76836F;
  --afavor:#1E9A3A; --afavor-dim:#D3EED8; --afavor-txt:#12702F;
  --encontra:#D63A2A; --encontra-dim:#F9D9D3; --encontra-txt:#B02A1C;
  --amarillo:#9A7A12; --oro:#C9A227; --hdr:rgba(243,245,240,.94);
}
[data-theme="light"] body{background-image:none}
[data-theme="light"] .escudo,[data-theme="light"] .fab,.toast{color:var(--campo)!important}
.themebtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--cal-fuerte);display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--tiza);flex-shrink:0}
.themebtn:hover{background:var(--panel2)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--campo);color:var(--tiza);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -180px,rgba(217,178,60,.055),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--tiza);background:var(--campo);border:1px solid var(--cal-fuerte);border-radius:8px;padding:9px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--tiza);outline-offset:2px}
::placeholder{color:var(--tiza3)}

.wrap{max-width:1000px;margin:0 auto;padding:0 14px}


/* ---------- marca institucional ---------- */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.escudo{height:46px;width:auto;flex-shrink:0;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
@media(max-width:719px){.escudo{height:36px}}
.tagline{font-family:var(--body);font-style:italic;font-size:10.5px;color:var(--tiza2);margin-top:2px;line-height:1.25}
.tagline.q{margin-top:0;color:var(--tiza3)}
.slogan{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--oro);margin-top:1px}


/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--cal)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 6px}
.kicker{font-family:var(--cond);font-weight:600;font-size:9.5px;letter-spacing:.16em;color:var(--tiza2);text-transform:uppercase}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(17px,4vw,24px);letter-spacing:.02em;line-height:1;text-transform:uppercase}
h1 .x{color:var(--oro)}
.sub{font-size:10px;color:var(--tiza2);margin-top:1px}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn{font-family:var(--cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--cal-fuerte);border-radius:999px;padding:8px 16px;background:var(--panel);white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--oro);color:#241a03;border-color:var(--oro)}
.btn.primary:hover{background:#E9C554}
.btn.danger{color:var(--encontra-txt);border-color:rgba(255,109,90,.4)}
#btnNuevoTop{display:none}
@media(min-width:720px){#btnNuevoTop{display:inline-block}}

.menu{position:relative}
.menu summary{list-style:none;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--cal-fuerte);border-radius:999px;padding:6px 12px;background:var(--panel);cursor:pointer;user-select:none}
.menu summary::-webkit-details-marker{display:none}
.menu[open] summary{background:var(--panel2)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel2);border:1px solid var(--cal-fuerte);border-radius:12px;
  min-width:220px;padding:6px;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu-pop button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.menu-pop button:hover{background:var(--panel3)}
.menu-note{font-size:11px;color:var(--tiza3);padding:6px 10px 4px;border-top:1px solid var(--cal);margin-top:4px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid var(--cal);color:var(--tiza2);flex-shrink:0}
.tab:hover{color:var(--tiza);border-color:var(--cal-fuerte)}
.tab.on{background:var(--oro);color:#241a03;border-color:var(--oro)}

/* ---------- secciones ---------- */
main{padding:18px 0 96px}
section{margin-bottom:26px}
.sec-t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-t h2{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--tiza2);white-space:nowrap}
.sec-t .rule{flex:1;height:1px;background:var(--cal)}
.hint{font-size:12px;color:var(--tiza3);margin-top:8px}

.sec-toggle{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:0;padding-bottom:12px}
.sec-toggle h2{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.12em;text-transform:uppercase;color:var(--tiza2);white-space:nowrap}
.sec-toggle .rule{flex:1;height:1px;background:var(--cal)}
.sec-chev{color:var(--tiza3);font-size:13px;transition:transform .2s ease;flex-shrink:0}
.sec-wrap.open .sec-chev{transform:rotate(180deg)}
.sec-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.sec-wrap.open .sec-collapse{grid-template-rows:1fr}
.sec-collapse-in{overflow:hidden;padding-top:2px}

.subacc{background:var(--panel);border:1px solid var(--cal);border-radius:12px;padding:4px 10px;margin-top:8px}
.subacc:first-of-type{margin-top:0}
.sec-toggle.sub{padding:9px 0}
.sec-toggle.sub h2{font-size:13px;letter-spacing:.09em;color:var(--tiza)}
.tag-count{font-family:var(--cond);font-weight:700;font-size:11px;color:var(--tiza3);background:var(--campo);
  border-radius:999px;padding:2px 8px;flex-shrink:0}
.subacc .sec-collapse-in{padding-bottom:10px}

/* ---------- chips ---------- */
.chipsbar{display:flex;align-items:center;gap:6px}
.chips{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chipsnav{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--cal-fuerte);background:var(--panel);
  color:var(--tiza2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.chipsnav:hover{background:var(--panel3);color:var(--tiza)}
.chip{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 12px;border-radius:999px;border:1px solid var(--cal);color:var(--tiza2);flex-shrink:0;white-space:nowrap}
.chip:hover{border-color:var(--cal-fuerte);color:var(--tiza)}
.chip.on{background:var(--oro);color:#241a03;border-color:var(--oro)}
.chip .n{opacity:.65;font-weight:500;margin-left:4px}
.seg{display:inline-flex;border:1px solid var(--cal-fuerte);border-radius:999px;overflow:hidden}
.seg button{font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;color:var(--tiza2)}
.seg button.on{background:var(--oro);color:#241a03}
.seg button.on.segM{background:var(--afavor);color:#08130c}
.seg button.on.segR{background:var(--encontra);color:#fff}

/* ---------- marcador (hero) ---------- */
.score{position:relative;background:var(--panel);border:1px solid var(--cal);border-radius:14px;padding:12px 12px 10px;overflow:hidden}
.score svg.mediacancha{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.score-grid{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.score-side{text-align:center}
.score-num{font-family:var(--cond);font-weight:700;font-size:clamp(32px,9vw,48px);line-height:.9;font-variant-numeric:tabular-nums}
.score-side.m .score-num{color:var(--afavor)}
.score-side.r .score-num{color:var(--encontra)}
.score-lbl{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tiza2);margin-top:3px}
.score-dif{text-align:center}
.dif-chip{display:inline-block;font-family:var(--cond);font-weight:700;font-size:14px;border:1px solid var(--cal-fuerte);border-radius:999px;padding:4px 10px;background:var(--campo)}
.dif-chip.pos{color:var(--afavor-txt)} .dif-chip.neg{color:var(--encontra-txt)} .dif-chip.cero{color:var(--tiza2)}
.dif-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tiza3);margin-top:3px}

/* ---------- gráfico de conceptos (columna única, deslizable) ---------- */
.mnav{display:flex;gap:5px;margin-bottom:6px}
.mnavbtn{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 12px;border-radius:999px;border:1px solid var(--cal);color:var(--tiza2);flex:1}
.mnavbtn.on{background:var(--panel3);border-color:var(--cal-fuerte);color:var(--tiza)}
.mnavbtn.mM.on{background:var(--afavor-dim);border-color:var(--afavor);color:var(--afavor-txt)}
.mnavbtn.mR.on{background:var(--encontra-dim);border-color:var(--encontra);color:var(--encontra-txt)}
/* ---------- tinte según A favor / En contra ---------- */
body{--tint:rgba(61,194,78,.10);--tint2:rgba(61,194,78,.05);--tint-b:rgba(61,194,78,.30);--mode-txt:var(--afavor-txt)}
body[data-mode="R"]{--tint:rgba(232,64,47,.11);--tint2:rgba(232,64,47,.05);--tint-b:rgba(232,64,47,.32);--mode-txt:var(--encontra-txt)}
html[data-theme="light"] body{--tint:rgba(30,154,58,.10);--tint2:rgba(30,154,58,.05);--tint-b:rgba(30,154,58,.35)}
html[data-theme="light"] body[data-mode="R"]{--tint:rgba(214,58,42,.10);--tint2:rgba(214,58,42,.05);--tint-b:rgba(214,58,42,.35)}
body{background-image:linear-gradient(180deg,var(--tint) 0,var(--tint2) 420px,transparent 900px)!important;background-attachment:fixed;transition:background-color .3s}
header.top{border-bottom-color:var(--tint-b)}
.sec-t h2{color:var(--mode-txt)}
.sec-t .rule{background:var(--tint-b)}
.mcard,.mswipe,.score{border-color:var(--tint-b)}
.mcard{background-image:linear-gradient(90deg,var(--tint2),transparent 40%)}
.mswipe{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  border:1px solid var(--cal);border-radius:13px;background:var(--panel)}
.mswipe::-webkit-scrollbar{display:none}
.mslide{flex:0 0 100%;scroll-snap-align:start;min-width:100%;padding:3px}
.mcol{display:flex;flex-direction:column}
.mcol-row{display:grid;grid-template-columns:1fr minmax(56px,96px) 20px;align-items:center;gap:6px;
  padding:4px 7px;border-radius:8px;text-align:left;width:100%}
button.mcol-row:hover{background:var(--panel3)}
.mcol-label{font-size:12px;color:var(--tiza2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcol-row.M .mcol-label, .mcol-row.R .mcol-label{color:var(--tiza)}
.mcol-barwrap{height:6px;border-radius:999px;background:var(--campo);overflow:hidden}
.mcol-bar{display:block;height:100%;border-radius:999px}
.mcol-bar.M{background:var(--afavor)}
.mcol-bar.R{background:var(--encontra)}
.mcol-n{font-family:var(--cond);font-weight:700;font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--tiza2)}
.mempty{padding:12px;color:var(--tiza3);text-align:center;font-size:12px}


/* ---------- barra A favor / En contra (global) ---------- */
.modebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 0 9px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;border-radius:12px;border:1.5px solid var(--cal-fuerte);
  background:var(--panel2,var(--panel));color:var(--tiza2);font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.07em;text-transform:uppercase;transition:background .2s,border-color .2s,color .2s}
.mbtn b{font-size:22px;font-variant-numeric:tabular-nums;opacity:.9}
.mbtn.mM.on{background:var(--afavor);border-color:var(--afavor);color:#08130c}
.mbtn.mR.on{background:var(--encontra);border-color:var(--encontra);color:#fff}
.mbtn:not(.on){opacity:.75}
.score-side{cursor:pointer;transition:opacity .2s,transform .2s;opacity:.45}
.score-side.act{opacity:1;transform:scale(1.06)}
.score-side.act .score-lbl{font-weight:700}

/* ---------- dashboards ---------- */
.dash{border:1px solid var(--tint-b);border-radius:16px;background:var(--panel);padding:14px 12px 10px}
.dash-head{display:flex;align-items:center;gap:14px;padding:4px 6px 14px;margin-bottom:6px;border-bottom:1px solid var(--cal)}
.dh-n{font-family:var(--cond);font-weight:700;font-size:clamp(46px,13vw,64px);line-height:.85;font-variant-numeric:tabular-nums}
.dash.M .dh-n{color:var(--afavor)} .dash.R .dh-n{color:var(--encontra)}
.dh-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.dh-t b{font-family:var(--cond);font-size:clamp(16px,4.5vw,21px);letter-spacing:.06em;text-transform:uppercase;color:var(--tiza)}
.dh-t span{font-size:13px;color:var(--tiza2)}
.dh-t em{font-style:normal;font-weight:700;color:var(--tiza)}
.drows{display:flex;flex-direction:column;gap:2px}
.drow{display:flex;flex-direction:column;gap:7px;width:100%;text-align:left;padding:11px 10px 12px;border-radius:11px}
button.drow:hover{background:var(--panel3)}
.drow-top{display:flex;align-items:baseline;gap:10px}
.drow-label{flex:1;min-width:0;font-size:clamp(14px,3.8vw,16px);font-weight:600;color:var(--tiza);line-height:1.2}
.drow-n{font-family:var(--cond);font-weight:700;font-size:clamp(24px,7vw,30px);line-height:1;font-variant-numeric:tabular-nums}
.drow.M .drow-n{color:var(--afavor)} .drow.R .drow-n{color:var(--encontra)}
.drow-pct{font-family:var(--cond);font-weight:600;font-size:14px;min-width:38px;text-align:right;color:var(--tiza3);font-variant-numeric:tabular-nums}
.drow-track{display:block;height:16px;border-radius:999px;background:var(--campo);overflow:hidden}
.drow-bar{display:block;height:100%;border-radius:999px;opacity:.78;transition:width .4s}
.drow.M .drow-bar{background:var(--afavor)} .drow.R .drow-bar{background:var(--encontra)}
.drow.top .drow-bar{opacity:1}
.drow.top .drow-label{font-weight:700}
.drow.sg{margin-top:6px;border-top:1px dashed var(--cal-fuerte);border-radius:0;padding-top:14px}
.drow.sg .drow-label{font-style:italic;font-weight:500;color:var(--tiza2)}
@media(min-width:720px){.drows{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}.drow.sg{grid-column:1/-1}}


/* ---------- encabezado compacto ---------- */
.kicker,.brand .sub,.tagline,.tagline.q{display:none}
.top-in{padding:5px 0 3px}
.escudo{height:32px!important}
h1{font-size:clamp(15px,4vw,19px)}
.slogan{font-size:9.5px;margin-top:2px}
nav.tabs{padding:3px 0 5px}
.tab{padding:5px 11px;font-size:13px}
.modebar{padding:0 0 6px;gap:6px}
.mbtn{min-height:34px;font-size:14px;border-radius:10px}
.mbtn b{font-size:17px}
.themebtn{width:30px;height:30px}
.top-actions .btn,.menu summary{padding-top:5px;padding-bottom:5px;font-size:12px}

.mc-fase{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tiza3);margin-left:5px}
.mc-flag{display:inline-block;flex-shrink:0;margin-left:6px;white-space:nowrap;padding:1px 7px;border-radius:999px;border:1px solid #D9B23C;color:#D9B23C;font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.mc-flag.soft{border-color:var(--cal-fuerte);color:var(--tiza3)}
.fl-s{display:none}
@media(max-width:480px){.fl-l{display:none}.fl-s{display:inline}.mc-flag{padding:1px 5px;margin-left:4px}}
.gl-note.ng span{color:#D9B23C}
html[data-theme="light"] .mc-flag:not(.soft),html[data-theme="light"] .gl-note.ng span{color:#8a6a00;border-color:#b58a00}


/* ---------- admin / revisión de etiquetas ---------- */
.adminbtn{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--cal-fuerte);color:var(--tiza2);background:transparent}
.adminbtn[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:#241a03}
body.admin header.top{box-shadow:inset 0 -3px 0 var(--oro)}
:root{--rvG:#3DC24E;--rvY:#E6B92E;--rvR:#E8402F}
.rv-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.rv-dot.G{background:var(--rvG)}.rv-dot.Y{background:var(--rvY)}.rv-dot.R{background:var(--rvR)}
.tagchip.rv-G{border-color:var(--rvG)}.tagchip.rv-Y{border-color:var(--rvY)}.tagchip.rv-R{border-color:var(--rvR)}
.iconb.rvbtn.on{background:var(--oro);border-color:var(--oro);color:#241a03}
.rv-cnts{display:inline-flex;gap:3px;margin-left:6px;flex-shrink:0}
.rv-cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-family:var(--cond);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;color:#0b0f0b}
.rv-cnt.G{background:var(--rvG)}.rv-cnt.Y{background:var(--rvY)}.rv-cnt.R{background:var(--rvR);color:#fff}
.rv-notes{display:flex;flex-direction:column;gap:6px;padding:2px 12px 10px}
.rv-note{display:flex;flex-direction:column;gap:2px;padding:7px 10px;border-radius:9px;border-left:4px solid var(--cal-fuerte);background:var(--campo);font-size:12.5px;line-height:1.35}
.rv-note b{font-family:var(--cond);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tiza3)}
.rv-note span{color:var(--tiza)}
.rv-note.G{border-left-color:var(--rvG)}.rv-note.Y{border-left-color:var(--rvY)}.rv-note.R{border-left-color:var(--rvR)}
.rv-panel{margin:2px 12px 12px;padding:10px;border:1px solid var(--cal-fuerte);border-radius:12px;background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.rv-item{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px dashed var(--cal)}
.rv-item:last-of-type{border-bottom:0;padding-bottom:0}
.rv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rv-name{font-weight:700;font-size:13.5px}
.rv-btns{display:flex;gap:6px}

<script>

var v=document.getElementById("igV"),bg=document.getElementById("igBg"),go=document.getElementById("igGo"),p=document.getElementById("igP"),snd=document.getElementById("igSnd");

function ready(){ go.classList.add("on"); }
function sndUI(){ snd.textContent=v.muted?"🔇 Activar sonido":"🔊 Sonido activado"; snd.classList.toggle("alert",v.muted); }
function unmute(){ v.muted=false; v.volume=1; v.play().catch(function(){}); sndUI(); }
v.addEventListener("timeupdate",function(){ if(v.duration) p.style.width=(v.currentTime/v.duration*100)+"%"; });
v.addEventListener("ended",ready); v.addEventListener("error",ready);
setTimeout(function(){ if(v.paused) ready(); },4000);
/* intenta con sonido; si el navegador lo bloquea, arranca mudo y pide un toque */
v.muted=false;
var pr=v.play();
if(pr&&pr.catch) pr.catch(function(){ v.muted=true; v.play().catch(ready); sndUI(); });
sndUI();

function idbOpen(){
  if(_idb) return _idb;
  _idb = new Promise((res,rej)=>{

    const rq = indexedDB.open("gc-adjuntos",1);

    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
  return _idb;
}
async function idbPut(id, val){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction("files","readwrite"); tx.objectStore("files").put(val,id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function idbGet(id){ const db = await idbOpen(); return new Promise((res,rej)=>{ const rq=db.transaction("files").objectStore("files").get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function idbDel(id){ const db = await idbOpen(); return new Promise((res,rej)=>{ const tx=db.transaction("files","readwrite"); tx.objectStore("files").delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }

function purgeRemovedTags(){
  let changed = false;
  state.goals.forEach(g=>{
    if(g.tags && g.tags.some(t=>REMOVED_TAGS.includes(t))){
      g.tags = g.tags.filter(t=>!REMOVED_TAGS.includes(t));
      changed = true;
    }
  });
  REMOVED_TAGS.forEach(t=>{
    if(state.extraTags.includes(t)){ state.extraTags = state.extraTags.filter(x=>x!==t); changed = true; }
    if(state.tagGroups[t]!==undefined){ delete state.tagGroups[t]; changed = true; }
  });
  return changed;
}

}
function mergeSeed(){
  /* Planilla nueva: se conservan etiquetas/notas ya cargadas en cada gol, los goles creados a mano, los adjuntos y la sincronización. */
  const oldGroupOf = new Map();
  try{ CATIDS.forEach(c=>buildGroups(c).forEach(g=>g.goals.forEach(x=>oldGroupOf.set(x.id,g.key)))); }catch(e){}
  const k2 = g => [g.cat,g.tipo,(g.rival||"").toLowerCase(),g.numero,g.video].join("|");
  const k1 = g => g.video ? [g.cat,g.tipo,g.numero,g.video].join("|") : null;
  const kv = g => g.video ? [g.cat,g.tipo,g.video].join("|") : null;
  const idx = {k2:new Map(),k1:new Map(),kv:new Map()};
  const add = (m,k,g)=>{ if(k==null) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(g); };
  const olds = state.goals.filter(g=>!/^u/.test(String(g.id)));
  olds.forEach(g=>{ add(idx.k2,k2(g),g); add(idx.k1,k1(g),g); add(idx.kv,kv(g),g); });
  const manual = state.goals.filter(g=>/^u/.test(String(g.id)));
  const used = new Set();
  const take = (m,k)=>{ if(k==null) return null; const a = m.get(k)||[]; return a.find(o=>!used.has(o.id))||null; };
  const oldOf = new Map(); /* id nuevo -> grupo viejo */
  const claimed = new Set();
  const next = JSON.parse(JSON.stringify(SEED.goals)).map(sg=>{
    const o = take(idx.k2,k2(sg)) || take(idx.k1,k1(sg)) || take(idx.kv,kv(sg));
    let inherited = false;
    if(o){
      used.add(o.id); inherited = true;
      sg.tags = (o.tags&&o.tags.length) ? o.tags.slice() : sg.tags; sg.nota = o.nota||sg.nota; if(!sg.fecha && o.fecha) sg.fecha = o.fecha;
      if(o.rev) sg.rev = JSON.parse(JSON.stringify(o.rev));
      if(oldGroupOf.has(o.id)) oldOf.set(sg.id, oldGroupOf.get(o.id));
    }
    if(sg.numero>0){
      /* un gol cargado a mano que ahora está en la planilla: se toma su etiqueta/nota y no se duplica */
      const mg = manual.find(m=>!claimed.has(m.id) && m.cat===sg.cat && m.tipo===sg.tipo && (m.rival||"").toLowerCase()===(sg.rival||"").toLowerCase() && m.numero===sg.numero && (!m.video||!sg.video||m.video===sg.video) && (!m.fecha||!sg.fecha||m.fecha===sg.fecha));
      if(mg){
        claimed.add(mg.id);
        if(!inherited && mg.tags&&mg.tags.length) sg.tags = mg.tags.slice();
        sg.nota = sg.nota||mg.nota; if(mg.rev && !sg.rev) sg.rev = JSON.parse(JSON.stringify(mg.rev)); if(!sg.fecha && mg.fecha) sg.fecha = mg.fecha;
        if(!sg.video && mg.video) sg.video = mg.video;
        if(oldGroupOf.has(mg.id)) oldOf.set(sg.id, oldGroupOf.get(mg.id));
      }
    }
    return sg;
  });
  state.goals = next.concat(manual.filter(m=>!claimed.has(m.id)));
  state.matches = JSON.parse(JSON.stringify(SEED.matches));
  /* adjuntos: la clave del partido cambia si cambió su posición en la planilla; se reasignan por los goles que comparten */
  try{
    const oldAttach = state.attach||{}, moved = {}, remapped = new Set();
    CATIDS.forEach(c=>buildGroups(c).forEach(g=>{
      for(const x of g.goals){
        const ok = oldOf.get(x.id);
        if(ok && oldAttach[ok]){ moved[g.key] = (moved[g.key]||[]).concat(oldAttach[ok].filter(f=>!(moved[g.key]||[]).some(y=>y.id===f.id))); remapped.add(ok); }
      }
    }));
    const out = {};
    Object.keys(oldAttach).forEach(k=>{ if(!remapped.has(k)) out[k] = oldAttach[k]; });
    Object.keys(moved).forEach(k=>{ out[k] = (out[k]||[]).concat(moved[k]); });
    state.attach = out;
  }catch(e){}
  state.matchOrder = {}; /* el orden de la planilla manda */
}

function rescueTags(doc){
  const seedTags = new Map(SEED.goals.map(g=>[g.id, (g.tags||[]).slice().sort().join("|")]));
  const key = a => (a||[]).slice().sort().join("|");
  const olds = (doc.goals||[]);
  const matchOf = new Map();            /* id gol actual -> gol del otro documento */
  const usedOld = new Set(), done = new Set();
  const link = (g,r)=>{ matchOf.set(g.id,r); usedOld.add(r.id); done.add(g.id); };
  /* pasada 0: mismo id */
  const byId = new Map(olds.map(r=>[r.id,r]));
  state.goals.forEach(g=>{ const r = byId.get(g.id); if(r && !usedOld.has(r.id)) link(g,r); });
  /* pasada 1: mismo video y mismo número */
  const k1 = g => g.video ? [g.cat,g.tipo,ytId(g.video),g.numero].join("|") : null;
  const m1 = new Map(); olds.forEach(r=>{ if(!usedOld.has(r.id) && k1(r)) m1.set(k1(r), r); });
  state.goals.forEach(g=>{ if(done.has(g.id)) return; const r = k1(g) && m1.get(k1(g)); if(r && !usedOld.has(r.id)) link(g,r); });
  /* pasada 2: mismo video (si en cada lado es único y el número cambió) */
  const k2 = g => g.video ? [g.cat,g.tipo,ytId(g.video)].join("|") : null;
  const cOld = new Map(), cNew = new Map();
  olds.forEach(r=>{ if(!usedOld.has(r.id) && k2(r)) cOld.set(k2(r),(cOld.get(k2(r))||0)+1); });
  state.goals.forEach(g=>{ if(!done.has(g.id) && k2(g)) cNew.set(k2(g),(cNew.get(k2(g))||0)+1); });
  const m2 = new Map(); olds.forEach(r=>{ if(!usedOld.has(r.id) && k2(r) && cOld.get(k2(r))===1) m2.set(k2(r), r); });
  state.goals.forEach(g=>{ if(done.has(g.id)) return; const k = k2(g); const r = k && cNew.get(k)===1 && m2.get(k); if(r && !usedOld.has(r.id)) link(g,r); });
  /* pasada 3: gol que cambió de link en la planilla: mismo rival y número, solo entre los que quedaron sin pareja de ambos lados */
  const left = olds.filter(r=>!usedOld.has(r.id));
  const k3 = g => [g.cat,g.tipo,(g.rival||"").toLowerCase(),g.numero].join("|");
  const m3 = new Map(); left.forEach(r=>{ const k = k3(r); m3.set(k, m3.has(k) ? null : r); });
  state.goals.forEach(g=>{ if(done.has(g.id)) return; const r = m3.get(k3(g)); if(r && !usedOld.has(r.id)) link(g,r); });

  const now = Date.now(); let n = 0;
  state.goals.forEach(g=>{
    const r = matchOf.get(g.id); if(!r) return;
    const def = seedTags.has(g.id) ? seedTags.get(g.id) : null;
    const lc = def==null ? true : key(g.tags)!==def;
    const rc = (r.tags||[]).length>0 && ((r.tags||[]).length>1 || (r.tags||[]).some(t=>!CONCEPT_TAGS.includes(t)) || (def!=null && key(r.tags)!==def));
    let ch = false;
    if(rc && !lc){ g.tags = (r.tags||[]).slice(); ch = true; }
    else if(rc && lc && key(g.tags)!==key(r.tags)){ g.tags = [...new Set((g.tags||[]).concat(r.tags||[]))]; ch = true; }
    if(!g.nota && r.nota){ g.nota = r.nota; ch = true; }
    if(r.rev && !g.rev){ g.rev = JSON.parse(JSON.stringify(r.rev)); ch = true; }
    if(ch){ g._u = now; n++; }
  });
  (doc.extraTags||[]).forEach(t=>{ if(!CONCEPT_TAGS.includes(t) && !state.extraTags.includes(t)) state.extraTags.push(t); });
  return n;
}
async function migrateSeed(){
  const rem = await fetchRemoteDoc();
  if(rem && (rem.seedV||0) < SEED_VERSION){
    /* el servidor sigue con la planilla vieja: primero se une con lo de este dispositivo (nada se pierde) y recién después se migra */
    const m = mergeDocs(localDoc(), rem);
    state.goals = m.goals; state.matches = m.matches; state.extraTags = m.extraTags; state.matchOrder = m.matchOrder; state.attach = m.attach; sync.tomb = m.tomb;
  }
  mergeSeed();
  if(rem && (rem.seedV||0) >= SEED_VERSION) rescueTags(rem);
}
async function load(){
  try{
    let raw = null;
    if(hasClaudeStore){ const r = await window.storage.get(KEY); raw = r && r.value; }
    else if(hasLocalStore){ raw = localStorage.getItem(KEY); }
    if(raw){
      const d = JSON.parse(raw);
      if(d && (d.v===2||d.v===3) && Array.isArray(d.goals)){
        state.goals=d.goals;
        state.matches=Array.isArray(d.matches)?d.matches:[];
        backfillMatchFlags();
        state.matchOrder = (d.matchOrder && typeof d.matchOrder==='object') ? d.matchOrder : {};
        state.attach = (d.attach && typeof d.attach==='object') ? d.attach : {};
        if(d.sync && typeof d.sync==='object'){ sync.rev = d.sync.rev||0; sync.snap = d.sync.snap||null; sync.tomb = d.sync.tomb||{}; }
        state.extraTags=Array.isArray(d.extraTags)?d.extraTags:[];
        state.tagGroups = (d.v===3 && d.tagGroups && typeof d.tagGroups==="object") ? d.tagGroups : {...DEFAULT_TAG_GROUPS};
        let mig = false;
        if(d.seedV !== SEED_VERSION){ await migrateSeed(); ensureIndividualBase(); mig = true; }
        if(purgeRemovedTags() || mig) save();
        return;
      }
    }
  }catch(e){ /* clave inexistente o corrupta: primer uso */ }
  state.goals = JSON.parse(JSON.stringify(SEED.goals));
  state.matches = JSON.parse(JSON.stringify(SEED.matches));
  state.extraTags = [];
  state.tagGroups = {...DEFAULT_TAG_GROUPS};
  ensureIndividualBase();
  if(hasStore) save();
}
async function save(noSync){
  ui.dirty = true;
  if(!noSync) schedulePush();
  if(!hasStore) return;
  try{
    const payload = JSON.stringify({v:3, seedV:SEED_VERSION, goals:state.goals, matches:state.matches, extraTags:state.extraTags, tagGroups:state.tagGroups, matchOrder:state.matchOrder, attach:state.attach, sync:{rev:sync.rev, snap:sync.snap, tomb:sync.tomb}});
    if(hasClaudeStore) await window.storage.set(KEY, payload);
    else if(hasLocalStore) localStorage.setItem(KEY, payload);
  }catch(e){ toast("No pude guardar — exportá tus datos"); }
}


/* ============ sincronización entre dispositivos (Netlify Functions + Blobs) ============ */
const sync = { rev:0, snap:null, tomb:{}, timer:null, busy:false, again:false, dirty:false, status:"off", lastOk:0 };
const SYNC_ON = /^https?:$/.test(location.protocol);
const SYNC_URL = "/api/data";
const stripU = g => { const c = {...g}; delete c._u; return JSON.stringify(c); };
function syncHeaders(){ return {"content-type":"application/json"}; }
function setSyncStatus(s){
  sync.status = s;
  const el = document.getElementById("syncDot"); if(!el) return;
  const map = {ok:["Sincronizado","#3DC24E"], busy:["Sincronizando…","#D9B23C"], off:["Sin conexión: se sincroniza cuando vuelva","#8a8f86"], err:["No se pudo sincronizar","#E8402F"]};
  const m = map[s]||map.off; el.title = m[0]; el.style.background = m[1]; el.setAttribute("aria-label", m[0]);
}
function baselineSnap(){
  if(sync.snap) return sync.snap;
  /* dispositivo que nunca sincronizó: lo que es igual a la planilla base no cuenta como cambio */
  const s = {}; SEED.goals.forEach(g=>{ s[g.id] = stripU(g); }); return s;
}
function stampChanges(){
  const snap = baselineSnap(), now = Date.now(), ids = new Set();
  state.goals.forEach(g=>{
    ids.add(g.id);
    if(snap[g.id] !== stripU(g)) g._u = now;
    if(sync.tomb[g.id]) delete sync.tomb[g.id];
  });
  Object.keys(snap).forEach(id=>{ if(!ids.has(id) && !sync.tomb[id]) sync.tomb[id] = now; });
}
function hasLocalChanges(){
  const snap = baselineSnap();
  if(state.goals.some(g=>snap[g.id] !== stripU(g))) return true;
  const ids = new Set(state.goals.map(g=>g.id));
  return Object.keys(snap).some(id=>!ids.has(id));
}
function localDoc(){
  return {seedV:SEED_VERSION, goals:state.goals, matches:state.matches, extraTags:state.extraTags, tagGroups:state.tagGroups, matchOrder:state.matchOrder, attach:state.attach, tomb:sync.tomb};
}
function mergeDocs(L, R){
  const tomb = {...(R.tomb||{})}; Object.keys(L.tomb||{}).forEach(k=>{ tomb[k] = Math.max(tomb[k]||0, L.tomb[k]); });
  const gm = new Map();
  (R.goals||[]).forEach(g=>gm.set(g.id,g));
  (L.goals||[]).forEach(g=>{ const r = gm.get(g.id); if(!r || (g._u||0) >= (r._u||0)) gm.set(g.id,g); });
  const goals = [...gm.values()].filter(g=> !(tomb[g.id] && tomb[g.id] > (g._u||0)));
  const lv = L.seedV||0, rv = R.seedV||0;
  const mm = new Map(); (lv>rv ? (L.matches||[]) : rv>lv ? (R.matches||[]) : (R.matches||[]).concat(L.matches||[])).forEach(m=>mm.set(m.id,m));
  const matches = [...mm.values()].filter(m=>!tomb["m:"+m.id]);
  const extraTags = [...new Set((R.extraTags||[]).concat(L.extraTags||[]))].filter(t=>!tomb["t:"+t]);
  const tagGroups = {...(R.tagGroups||{}), ...(L.tagGroups||{})};
  const matchOrder = lv>rv ? {...(L.matchOrder||{})} : rv>lv ? {...(R.matchOrder||{})} : {...(R.matchOrder||{}), ...(L.matchOrder||{})};
  const attach = {};
  const keys = new Set(Object.keys(R.attach||{}).concat(Object.keys(L.attach||{})));
  keys.forEach(k=>{
    const m = new Map(); ((R.attach||{})[k]||[]).concat(((L.attach||{})[k])||[]).forEach(f=>m.set(f.id,f));
    const arr = [...m.values()].filter(f=>!tomb["f:"+f.id]); if(arr.length) attach[k] = arr;
  });
  return {seedV:Math.max(L.seedV||0,R.seedV||0), goals, matches, extraTags, tagGroups, matchOrder, attach, tomb};
}
function applyDoc(d){
  state.goals = d.goals||[]; state.matches = d.matches||[]; state.extraTags = d.extraTags||[];
  state.tagGroups = d.tagGroups||{}; state.matchOrder = d.matchOrder||{}; state.attach = d.attach||{};
  sync.tomb = d.tomb||{};
  backfillMatchFlags(); purgeRemovedTags(); ensureIndividualBase();
  sync.snap = {}; state.goals.forEach(g=>{ sync.snap[g.id] = stripU(g); });
}
function refreshAfterRemote(){
  if($("#overlay").classList.contains("open") || drag) return;
  render();
}
function schedulePush(){
  if(!SYNC_ON) return;
  sync.dirty = true;
  clearTimeout(sync.timer);
  sync.timer = setTimeout(()=>syncNow(), 800);
}
async function syncNow(){
  if(!SYNC_ON) return;
  if(sync.busy){ sync.again = true; return; }
  sync.busy = true; setSyncStatus("busy");
  let changed = false;
  try{
    for(let attempt=0; attempt<3; attempt++){
      const r = await fetch(SYNC_URL, {headers:syncHeaders(), cache:"no-store"});
      if(r.status===401) throw new Error("auth");
      if(!r.ok) throw new Error("get "+r.status);
      const remote = await r.json();
      const local = sync.dirty || hasLocalChanges();
      if(!remote.doc){                           /* servidor vacío: este dispositivo lo inicializa */
        stampChanges();
      } else if(remote.rev === sync.rev){
        if(!local) break;                        /* nada nuevo en ningún lado */
        stampChanges();
      } else if(!local){                         /* cambios de otros dispositivos, nada propio pendiente */
        applyDoc(remote.doc); sync.rev = remote.rev; changed = true; await save(true); break;
      } else {                                   /* cambios en ambos lados: se fusionan */
        stampChanges();
        applyDoc(mergeDocs(localDoc(), remote.doc)); sync.rev = remote.rev; changed = true;
      }
      const put = await fetch(SYNC_URL, {method:"PUT", headers:syncHeaders(), body:JSON.stringify({baseRev:sync.rev, doc:localDoc()})});
      if(put.status===409){ continue; }
      if(!put.ok) throw new Error("put "+put.status);
      const res = await put.json(); sync.rev = res.rev; sync.dirty = false;
      sync.snap = {}; state.goals.forEach(g=>{ sync.snap[g.id] = stripU(g); });
      await save(true);
      break;
    }
    sync.lastOk = Date.now(); setSyncStatus("ok");
    if(changed) refreshAfterRemote();
  }catch(e){
    setSyncStatus(e && e.message==="auth" ? "err" : (navigator.onLine===false ? "off" : "err"));
  }finally{
    sync.busy = false;
    if(sync.again){ sync.again = false; schedulePush(); }
  }
}

/* ============ derivados ============ */
function conceptCatalog(){ return CONCEPT_TAGS.slice(); }
function labelCatalog(){

  state.extraTags.forEach(t=>{ if(!CONCEPT_TAGS.includes(t)) set.add(t); });

function catalog(){ return conceptCatalog().concat(labelCatalog()); }
function groupOf(tag){ return "Concepto"; }

/* Dashboard de barras horizontales: muestra solo el lado activo (ui.fTipo), el que se eligió arriba de la página. */
function mirrorChart(scopeCat, clickable, tagList, withSG){
  const tipo = ui.fTipo==="R" ? "R" : "M";

  }
  const rowHtml = rows.map((x,i)=>{

    const title = `${x.n} ${x.n===1?"gol":"goles"} ${word} · ${pct}% — ${x.t}`;
    const isBtn = !!clickable;

      <span class="drow-top"><span class="drow-label">${esc(x.t)}</span><span class="drow-n">${x.n}</span><span class="drow-pct">${pct}%</span></span>

    </${el}>`;
  }).join("");
  let sgHtml = "";

    const n = sgCount(scopeCat,tipo);
    sgHtml = `<div class="drow sg ${tipo}" title="${n} partidos ${tipo==="M"?"sin marcar":"sin recibir"}">

    </div>`;
  }
  return `<div class="dash ${tipo}">${head}<div class="drows">${rowHtml}${sgHtml}</div></div>`;
}


/* ---------- agrupamiento por partido ---------- */
function groupKeyFor(it, f){
  f = f===undefined ? it.fecha : f;
  return f
    ? `${it.cat}|F|${(it.rival||"").toLowerCase()}|${f}`
    : `${it.cat}|N|${it.tipo}|${(it.rival||"").toLowerCase()}|${it.orden??it.id}`;
}
function buildGroups(cat){
  const map = new Map();
  /* Misma fila de la planilla (categoría + rival + posición) = mismo partido: si una celda trae la fecha, las demás la heredan. */
  const rowK = it => it.orden!=null ? `${(it.rival||"").toLowerCase()}|${it.orden}` : null;
  const fill = new Map();
  const all = state.goals.filter(x=>x.cat===cat).concat(state.matches.filter(x=>x.cat===cat));
  all.forEach(it=>{ const k = rowK(it); if(k && it.fecha && !fill.has(k)) fill.set(k, it.fecha); });
  const ef = it => it.fecha || (rowK(it) ? fill.get(rowK(it)) : null) || null;
  const take = it => {
    const f = ef(it);
    const key = groupKeyFor(it, f);
    let g = map.get(key);
    if(!g){ g = {key, rival:it.rival, fecha:f, orden:it.orden, goals:[], matches:[]}; map.set(key,g); }
    if(it.tags) g.goals.push(it); else g.matches.push(it);
    if(f && !g.fecha) g.fecha = f;
    if(it.fase && !g.fase) g.fase = it.fase;
    if(it.orden!=null && (g.orden==null || it.orden<g.orden)) g.orden = it.orden;
  };
  state.goals.filter(x=>x.cat===cat).forEach(take);
  state.matches.filter(x=>x.cat===cat).forEach(take);
  let raw = [...map.values()];

  const dated = raw.filter(g=>g.fecha);
  const undated = raw.filter(g=>!g.fecha);

  // Agrupar los "sin fecha" por rival y lado (M/R); cada uno ya viene clusterizado por fila de origen.
  const byRival = new Map();
  undated.forEach(g=>{
    const rk = (g.rival||"").toLowerCase();
    if(!byRival.has(rk)) byRival.set(rk, {M:[], R:[]});
    const side = (g.goals[0]||g.matches[0]).tipo;
    byRival.get(rk)[side].push(g);
  });

  const merged = [], leftover = [], noJugados = [], noGrabados = [];
  const pushNoJ = (a,b,x)=> (x.matches.some(m=>m.estado==="no grabado") ? b : a).push(x);
  const keep = (x)=>{ pushNoJ(noJugados,noGrabados,x); merged.push(x); };
  byRival.forEach(sides=>{
    const Ms = sides.M, Rs = sides.R;
    // emparejar por cercanía de fila de origen (misma posición aproximada en ambas planillas)
    const cands = [];
    Ms.forEach((m,mi)=>Rs.forEach((r,ri)=>cands.push([Math.abs((m.orden??0)-(r.orden??0)), mi, ri])));
    cands.sort((a,b)=>a[0]-b[0]);
    const usedM = new Set(), usedR = new Set(), pairs = [];
    cands.forEach(([,mi,ri])=>{
      if(usedM.has(mi)||usedR.has(ri)) return;
      usedM.add(mi); usedR.add(ri); pairs.push([Ms[mi], Rs[ri]]);
    });
    pairs.forEach(([gm,gr])=>{
      const sup = {
        key: gm.key+"+"+gr.key, rival: gm.rival||gr.rival, fecha:null, fase: gm.fase||gr.fase,
        orden: Math.min(gm.orden??999, gr.orden??999),
        goals: gm.goals.concat(gr.goals), matches: gm.matches.concat(gr.matches)
      };
      keep(sup);
    });
    Ms.forEach((m,mi)=>{ if(!usedM.has(mi)){ leftover.push(m); } });
    Rs.forEach((r,ri)=>{ if(!usedR.has(ri)){ leftover.push(r); } });
  });

  let groups = dated.concat(merged, leftover).map(g=>{
    g.m = g.goals.filter(x=>x.tipo==="M").length;
    g.r = g.goals.filter(x=>x.tipo==="R").length;
    g.hasM = g.m>0 || g.matches.some(x=>x.tipo==="M");
    g.hasR = g.r>0 || g.matches.some(x=>x.tipo==="R");
    return g;
  });
  groups.sort((a,b)=>
    (a.orden??999)-(b.orden??999) ||
    String(a.fecha||"9999").localeCompare(String(b.fecha||"9999")) ||
    (a.rival||"").localeCompare(b.rival||"","es"));
  const ord = state.matchOrder && state.matchOrder[cat];
  if(Array.isArray(ord) && ord.length){
    const idx = new Map(ord.map((k,i)=>[k,i]));
    const withPos = groups.map((g,i)=>({g, p: idx.has(g.key) ? idx.get(g.key) : 1e6+i}));
    withPos.sort((a,b)=>a.p-b.p);
    groups.splice(0, groups.length, ...withPos.map(x=>x.g));
  }
  groups.noJugados = noJugados.map(g=>g.rival||"rival s/d");
  groups.noGrabados = noGrabados.map(g=>g.rival||"rival s/d");
  return groups;
}

const RV = {G:{n:"Correcta",i:"✓"}, Y:{n:"A mejorar",i:"!"}, R:{n:"Incorrecta",i:"✕"}};
function revOf(g,t){ return (g.rev && g.rev[t]) || null; }
function sortedTags(g){ const c = CONCEPT_TAGS; return (g.tags||[]).slice().sort((a,b)=> (c.includes(a)?0:1)-(c.includes(b)?0:1)); }
function reviewPanel(g){
  const tags = sortedTags(g);
  if(!tags.length) return `<div class="rv-panel"><div class="rv-empty">Este gol no tiene etiquetas para revisar.</div><div class="rv-foot"><button type="button" class="btn" data-act="revclose">Cerrar</button></div></div>`;
  return `<div class="rv-panel">${tags.map(t=>{
    const r = revOf(g,t)||{};
    return `<div class="rv-item">
      <div class="rv-top"><span class="rv-name">${esc(t)}</span>
        <span class="rv-btns">${["G","Y","R"].map(c=>`<button type="button" class="rv-b ${c} ${r.c===c?"on":""}" data-act="revset" data-id="${esc(g.id)}" data-tag="${esc(t)}" data-c="${c}" title="${RV[c].n}" aria-label="${RV[c].n}" aria-pressed="${r.c===c}">${RV[c].i}</button>`).join("")}
        ${r.c?`<button type="button" class="rv-b clr" data-act="revset" data-id="${esc(g.id)}" data-tag="${esc(t)}" data-c="" title="Quitar revisión" aria-label="Quitar revisión">↺</button>`:""}</span>
      </div>
      <textarea class="rv-text" rows="2" data-revtext data-id="${esc(g.id)}" data-tag="${esc(t)}" placeholder="Corrección para el entrenador (ej.: es Centro cruzado, no Centro costado)">${esc(r.n||"")}</textarea>
    </div>`;}).join("")}
    <div class="rv-foot"><span class="rv-hint">Solo lo ves vos en modo admin</span><button type="button" class="btn primary" data-act="revclose">Listo</button></div>
  </div>`;
}
function goalLine(g, hl){

    : `<span class="tagchip none">sin etiquetas</span>`;
  const notes = adm ? sortedTags(g).map(t=>{ const r = revOf(g,t); return (r&&r.n) ? `<div class="rv-note ${r.c||"N"}"><b>${esc(t)}</b><span>${esc(r.n)}</span></div>` : ""; }).join("") : "";
  const isOpen = adm && ui.revOpen===g.id;

      ${g.video?`<a class="iconb play" href="${esc(g.video)}" target="_blank" rel="noopener" title="Ver video" aria-label="Ver video">▶</a>`:""}
      <button class="iconb" data-act="edit" data-id="${esc(g.id)}" title="Editar gol" aria-label="Editar gol">✎</button>
    </div>
  </div>${notes?`<div class="rv-notes">${notes}</div>`:""}${isOpen?reviewPanel(g):""}${g.nota?`<div class="gl-note" style="border-bottom:1px solid var(--cal)"><span>${esc(g.nota)}</span></div>`:""}`;
}

function matchCard(g, forceOpen){
  const files = (state.attach && state.attach[g.key]) || [];
  const open = forceOpen || ui.expandedKeys.has(g.key);
  const scope = ui.fTipo; // ALL | M | R
  const showM = scope!=="R", showR = scope!=="M";
  const matchTag = it => ui.fTag==="__none__" ? !(it.tags&&it.tags.length) : (ui.fTag ? (it.tags||[]).includes(ui.fTag) : false);

  const mLines = showM ? g.goals.filter(x=>x.tipo==="M").map(x=>goalLine(x, matchTag(x))).join("") : "";
  const rLines = showR ? g.goals.filter(x=>x.tipo==="R").map(x=>goalLine(x, matchTag(x))).join("") : "";
  const mMatch = g.matches.find(x=>x.tipo==="M"), rMatch = g.matches.find(x=>x.tipo==="R");
  const mNG = !!(mMatch && mMatch.estado==="no grabado"), rNG = !!(rMatch && rMatch.estado==="no grabado");
  const mNote = !showM ? "" : mNG ? `<div class="gl-note ng"><span>⚠ Goles marcados: no se grabaron, sin registro del partido</span></div>`
    : (g.hasM && g.m===0) ? `<div class="gl-note"><span>No marcó en este partido</span></div>` : "";
  const rNote = !showR ? "" : rNG ? `<div class="gl-note ng"><span>⚠ Goles recibidos: no se grabaron, sin registro del partido</span></div>`
    : (g.hasR && g.r===0) ? `<div class="gl-note"><span>No recibió goles · valla en cero</span></div>` : "";
  const sc = (has,n,ng,cls)=> ng ? `<span class="unk" title="no grabado">?</span>` : `<span class="${has?cls:"unk"}">${has?n:"—"}</span>`;

  const scoreHtml = (g.goals.length>0)
    ? `<span class="mc-score"><span class="sm">${g.m}</span><span class="sep">–</span><span class="sr">${g.r}</span></span>`
    : `<span class="mc-score">${sc(g.hasM,g.m,mNG,"sm")}<span class="sep">–</span>${sc(g.hasR,g.r,rNG,"sr")}</span>`;
  let rvDots = "";
  if(ui.admin){
    const cnt = {G:0,Y:0,R:0};
    g.goals.forEach(x=>Object.values(x.rev||{}).forEach(r=>{ if(r&&r.c) cnt[r.c]++; }));
    rvDots = ["R","Y","G"].filter(c=>cnt[c]).map(c=>`<span class="rv-cnt ${c}" title="${RV[c].n}">${cnt[c]}</span>`).join("");
    if(rvDots) rvDots = `<span class="rv-cnts">${rvDots}</span>`;
  }
  const flag = (mNG||rNG) ? `<span class="mc-flag" title="No grabado"><span class="fl-l">no grabado</span><span class="fl-s">no grab.</span></span>` : (g.goals.length===0 ? `<span class="mc-flag soft">sin goles</span>` : "");

  return `
  <div class="mcard ${open?"open":""}" data-key="${esc(g.key)}">
    <div class="mc-top">
      <button type="button" class="mc-drag" aria-label="Mover partido (arrastrá, o usá flechas arriba/abajo)" title="Arrastrá para mover">⋮⋮</button>
      <button class="mc-head" data-act="togglecard" data-key="${esc(g.key)}">
        <span class="mc-rival"><span class="vs">vs</span> ${esc(g.rival||"Rival s/d")}${g.fase?` <small class="mc-fase">${esc(g.fase)}</small>`:""}</span>${flag}
        ${files.length?`<span class="mc-attn" title="${files.length} archivo${files.length>1?"s":""} adjunto${files.length>1?"s":""}">📎${files.length>1?files.length:""}</span>`:""}
        ${rvDots}<span class="mc-fecha">${g.fecha?fmtFecha(g.fecha):"s/f"}</span>
        ${scoreHtml}
        <span class="mc-chev">▾</span>
      </button>
    </div>
    <div class="mc-body"><div class="mc-body-in">
      ${mLines}${mNote}${rLines}${rNote}
      <div class="att-box">
        ${files.map(f=>`<div class="att-row">
          <button type="button" class="att-open" data-act="openatt" data-key="${esc(g.key)}" data-id="${esc(f.id)}" title="Abrir en una pestaña nueva">↗ ${esc(f.name)}</button>
          <span class="att-size">${fmtKB(f.size||0)}</span>
          <button type="button" class="iconb" data-act="delatt" data-key="${esc(g.key)}" data-id="${esc(f.id)}" title="Quitar archivo" aria-label="Quitar archivo">✕</button>
        </div>`).join("")}
        <button type="button" class="btn att-add" data-act="addatt" data-key="${esc(g.key)}">+ Adjuntar HTML</button>
      </div>
    </div></div>
  </div>`;
}

function renderCategoria(cat){
  let groups = buildGroups(cat);
  let forceOpenKeys = new Set();
  if(ui.fTipo==="M") groups = groups.filter(g=>g.hasM);
  else if(ui.fTipo==="R") groups = groups.filter(g=>g.hasR);

  if(ui.admin && ui.fRev){
    const inS = it => it.tipo===ui.fTipo;
    groups = groups.filter(g => g.goals.some(x=>inS(x) && Object.values(x.rev||{}).some(r=>r&&r.c===ui.fRev)));
    groups.forEach(g=>forceOpenKeys.add(g.key));
  }
  if(ui.fTag){
    const inScope = it => ui.fTipo==="ALL" || it.tipo===ui.fTipo;
    const tagMatch = it => ui.fTag==="__none__" ? !(it.tags&&it.tags.length) : (it.tags||[]).includes(ui.fTag);
    groups = groups.filter(g => g.goals.some(x=>inScope(x)&&tagMatch(x)));
    groups.forEach(g=>forceOpenKeys.add(g.key));
  }

  const scoped = goalsOf(cat, ui.fTipo);
  const counts = tagCounts(scoped);
  const sinTag = scoped.filter(g=>!(g.tags&&g.tags.length)).length;
  const tagChips = catalog()
    .map(t=>({t, n: counts.get(t)||0}))
    .filter(x=>x.n || ui.fTag===x.t)
    .sort((a,b)=> b.n-a.n || a.t.localeCompare(b.t,"es"))
    .map(x=>`<button class="chip ${ui.fTag===x.t?"on":""}" data-act="ftag" data-tag="${esc(x.t)}">${esc(x.t)}<span class="n">${x.n}</span></button>`)
    .join("") + (sinTag?`<button class="chip ${ui.fTag==="__none__"?"on":""}" data-act="ftag" data-tag="__none__">Sin etiquetas<span class="n">${sinTag}</span></button>`:"");

  const rvCnt = {G:0,Y:0,R:0};
  if(ui.admin) goalsOf(cat, ui.fTipo).forEach(x=>Object.values(x.rev||{}).forEach(r=>{ if(r&&r.c) rvCnt[r.c]++; }));
  const rvBar = ui.admin ? `<div class="rv-bar"><span class="rv-bar-t">Revisión</span>${["R","Y","G"].map(c=>`<button type="button" class="rv-chip ${c} ${ui.fRev===c?"on":""}" data-act="frev" data-c="${c}"><i class="rv-dot ${c}"></i>${RV[c].n}<b>${rvCnt[c]}</b></button>`).join("")}</div>` : "";
  return `
  <section>
    <div class="cat-head">
      <h2>${catLabel(cat)}</h2>
    </div>
  </section>
  <section>${scoreboard(cat)}</section>
  ${conceptosSection(cat, true)}
  <section>
    <div class="sec-t"><h2>Partidos · ${groups.length}</h2><div class="rule"></div></div>
    ${rvBar}
    <div class="filters">
      <div class="chipsbar">
        <button type="button" class="chipsnav" data-chipsnav="-1" aria-label="Ver etiquetas anteriores">‹</button>
        <div class="chips">${tagChips}</div>
        <button type="button" class="chipsnav" data-chipsnav="1" aria-label="Ver más etiquetas">›</button>
      </div>
    </div>
    ${groups.length ? `
    <div class="matchlist">${groups.map(g=>matchCard(g, forceOpenKeys.has(g.key))).join("")}</div>
    <p class="hint">Tocá una tarjeta para ver los goles; arrastrá ⋮⋮ para reordenar los partidos; tocá una etiqueta para filtrar.${(state.matchOrder[cat]||[]).length?` <button type="button" class="reset-order" data-act="resetorder">Volver al orden original</button>`:""}</p>` :
    `<div class="empty">No hay partidos con este filtro.<br><button class="btn" data-act="clearf">Limpiar filtros</button></div>`}
  </section>
  ${desgloseSection(cat, true)}`;
}

function deleteTagEverywhere(tag){
  state.goals.forEach(g=>{ if(g.tags && g.tags.length) g.tags = g.tags.filter(x=>x!==tag); if(g.rev && g.rev[tag]){ delete g.rev[tag]; if(!Object.keys(g.rev).length) delete g.rev; } });
  state.extraTags = state.extraTags.filter(x=>x!==tag);
  delete state.tagGroups[tag];
  sync.tomb["t:"+tag] = Date.now();
  const i = ui.formTags.indexOf(tag); if(i>=0) ui.formTags.splice(i,1);
  if(ui.fTag===tag) ui.fTag = null;
  save();
  fillTagcloud();
  render();
  toast(`Etiqueta "${tag}" eliminada`);
}
function openModal(goal, pre){
  lastFocus = document.activeElement;

  ui.formTags = goal ? (goal.tags||[]).slice() : [];
  ui.formTipo = goal ? goal.tipo : (pre && pre.tipo && pre.tipo!=="ALL" ? pre.tipo : null);
  $("#modalT").textContent = goal ? "Editar gol" : "Cargar gol";
  $("#btnDel").hidden = !goal;
  $("#fCat").innerHTML = CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join("");
  $("#fCat").value = goal ? goal.cat : (pre && pre.cat && pre.cat!=="TOT" && pre.cat!=="ALL" ? pre.cat : CATIDS[0]);
  $("#fRival").value = goal ? (goal.rival||"") : "";
  $("#fNum").value = goal && goal.numero ? goal.numero : "";
  $("#fFecha").value = goal && goal.fecha ? goal.fecha : "";
  $("#fVideo").value = goal && goal.video ? goal.video : "";
  $("#fNota").value = goal && goal.nota ? goal.nota : "";
  $("#fNewTag").value = "";
  $("#ferr").textContent = "";
  $("#rivales").innerHTML = rivalesConocidos().map(r=>`<option value="${esc(r)}">`).join("");
  const cur = goal ? buildGroups($("#fCat").value).find(g=>g.goals.some(x=>x.id===goal.id)) : null;
  ui.formPartido = cur ? cur.key : null;
  fillPartidos();
  ui.formPartidoInit = ui.formPartido;

  $("#overlay").classList.add("open");

}
function fillPartidos(){
  const cat = $("#fCat").value;
  const gs = CATIDS.includes(cat) ? buildGroups(cat) : [];
  const opts = gs.map(g=>`<option value="${esc(g.key)}">vs ${esc(g.rival||"Rival s/d")} · ${g.fecha?fmtFecha(g.fecha):"s/f"} · ${g.m}–${g.r}</option>`).join("");
  $("#fPartido").innerHTML = `<option value="">Partido nuevo / escribir rival y fecha</option>` + opts;
  $("#fPartido").value = (ui.formPartido && gs.some(g=>g.key===ui.formPartido)) ? ui.formPartido : "";
  if($("#fPartido").value==="") ui.formPartido = null;
}
function closeModal(){
  $("#overlay").classList.remove("open");
  $("#fab").style.display = "";
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function paintTipo(){
  $("#segM").className = ui.formTipo==="M" ? "onM" : "";
  $("#segR").className = ui.formTipo==="R" ? "onR" : "";
}
function saveGoal(){
  const rival = $("#fRival").value.trim();
  const cat = $("#fCat").value;
  if(!ui.formTipo){ $("#ferr").textContent = "Elegí si el gol fue marcado o recibido."; return; }
  if(!CATIDS.includes(cat)){ $("#ferr").textContent = "Elegí la categoría."; return; }
  if(!rival){ $("#ferr").textContent = "Falta el rival."; return; }
  const video = $("#fVideo").value.trim();
  if(video && !/^https?:\/\//i.test(video)){ $("#ferr").textContent = "El link tiene que empezar con http:// o https://"; return; }
  const numRaw = $("#fNum").value.trim();
  const old = ui.editing ? state.goals.find(g=>g.id===ui.editing) : null;
  /* Se parte del gol existente para no perder campos internos (orden, sello de sincronización): así editar no separa el partido. */
  const goal = Object.assign({}, old||{}, {
    id: ui.editing || uid(),
    cat, tipo: ui.formTipo, rival,
    numero: numRaw ? Math.max(1, parseInt(numRaw,10)||1) : null,
    fecha: $("#fFecha").value || null,
    video: video || null,
    tags: ui.formTags.slice(),
    nota: $("#fNota").value.trim()
  });
  if(goal.rev){ Object.keys(goal.rev).forEach(t=>{ if(!goal.tags.includes(t)) delete goal.rev[t]; }); if(!Object.keys(goal.rev).length) delete goal.rev; }
  const tg = ui.formPartido ? buildGroups(cat).find(g=>g.key===ui.formPartido) : null;
  if(tg && !(old && ui.formPartidoInit===ui.formPartido && old.cat===goal.cat)){
    const sameTipo = tg.goals.concat(tg.matches).find(x=>x.tipo===goal.tipo && x.id!==goal.id && x.orden!=null);
    const ord = sameTipo ? sameTipo.orden : tg.orden;
    goal.rival = tg.rival || goal.rival;
    goal.fecha = tg.fecha || null;
    if(ord!=null) goal.orden = ord; else delete goal.orden;
  } else if(!tg && old && (old.cat!==goal.cat || (old.rival||"").toLowerCase()!==rival.toLowerCase() || (old.fecha||null)!==goal.fecha)){
    /* cambió de partido a mano: se suelta el orden viejo para que no arrastre a otro partido */
    delete goal.orden;
  }
  if(ui.editing){
    const i = state.goals.findIndex(g=>g.id===ui.editing);
    if(i>=0) state.goals[i] = goal;
  } else {
    state.goals.push(goal);
  }
  save();
  closeModal();
  toast(ui.editing ? "Gol actualizado" : "Gol guardado");
  if(ui.view!=="TOT" && ui.view!==goal.cat){ ui.view = goal.cat; ui.fTipo="M"; ui.fTag=null; }
  render();
}
function deleteGoal(){
  const g = state.goals.find(x=>x.id===ui.editing);
  if(!g) return;
  if(!confirm(`¿Eliminar el gol vs ${g.rival||"rival"}? Esta acción no se puede deshacer.`)) return;
  state.goals = state.goals.filter(x=>x.id!==ui.editing);
  save(); closeModal(); toast("Gol eliminado"); render();
}

/* ============ datos: exportar / importar / restaurar ============ */
async function doExport(){
  const files = {};
  for(const k of Object.keys(state.attach)){
    for(const f of state.attach[k]){ try{ const c = await idbGet(f.id); if(c!=null) files[f.id] = c; }catch(e){} }
  }
  const blob = new Blob([JSON.stringify({v:3, seedV:SEED_VERSION, goals:state.goals, matches:state.matches, extraTags:state.extraTags, tagGroups:state.tagGroups, matchOrder:state.matchOrder, attach:state.attach, attFiles:files}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "goles-conceptos-2026.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast("Datos exportados");
}
function doImport(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const goals = Array.isArray(d) ? d : (d && Array.isArray(d.goals) ? d.goals : null);
      if(!goals) throw new Error("formato");
      const clean = goals.filter(g => g && CATIDS.includes(g.cat) && (g.tipo==="M"||g.tipo==="R"))
        .map((g,i)=>({
          id: g.id || ("i"+i+uid()),
          cat: g.cat, tipo: g.tipo,
          rival: String(g.rival||"Rival s/d"),
          numero: g.numero!=null && !isNaN(+g.numero) ? +g.numero : null,
          fecha: g.fecha || null,
          video: g.video || null,
          tags: Array.isArray(g.tags) ? g.tags.map(String) : [],
          nota: String(g.nota||"")
        }));
      if(!clean.length) throw new Error("vacío");
      if(!confirm(`El archivo tiene ${clean.length} goles. ¿Reemplazar los datos actuales (${state.goals.length} goles)?`)) return;
      state.goals = clean;
      state.matches = (d && Array.isArray(d.matches)) ? d.matches : [];
      backfillMatchFlags();
      state.extraTags = (d && Array.isArray(d.extraTags)) ? d.extraTags.map(String) : [];
      state.tagGroups = (d && d.tagGroups && typeof d.tagGroups==="object") ? d.tagGroups : {...DEFAULT_TAG_GROUPS};
      purgeRemovedTags();
      state.matchOrder = (d && d.matchOrder && typeof d.matchOrder==='object') ? d.matchOrder : {};
      state.attach = (d && d.attach && typeof d.attach==='object') ? d.attach : {};
      if(d && d.attFiles && typeof d.attFiles==='object'){ Object.keys(d.attFiles).forEach(id=>{ idbPut(id, d.attFiles[id]).catch(()=>{}); }); }
      save(); ui.view="TOT"; ui.fTag=null; ui.fTipo="M"; render();
      toast("Datos importados");
    }catch(e){ toast("No pude leer ese archivo"); }
  };
  rd.readAsText(file);
}
function doReset(){
  if(!confirm("¿Restaurar los datos originales de la planilla? Se pierden los goles y etiquetas que hayas agregado acá.")) return;
  state.goals = JSON.parse(JSON.stringify(SEED.goals));
  state.matches = JSON.parse(JSON.stringify(SEED.matches));
  state.extraTags = [];
  state.tagGroups = {...DEFAULT_TAG_GROUPS};
  state.matchOrder = {};
  save(); ui.view="TOT"; ui.fTag=null; ui.fTipo="M"; render();
  toast("Planilla restaurada");
}

function printRows(scopeCat, tagList){
  const mC = tagCounts(goalsOf(scopeCat,"M"));
  const rC = tagCounts(goalsOf(scopeCat,"R"));
  const rows = tagList
    .map(t=>({t, m:mC.get(t)||0, r:rC.get(t)||0}))
    .filter(x=>x.m||x.r)
    .sort((a,b)=> Math.max(b.m,b.r)-Math.max(a.m,a.r) || (b.m+b.r)-(a.m+a.r) || a.t.localeCompare(b.t,"es"));
  if(!rows.length) return `<div class="pempty">Sin datos registrados todavía.</div>`;
  const max = Math.max(1, ...rows.map(x=>Math.max(x.m,x.r)));
  return `<div class="pmirror">${rows.map(x=>{
    const wm = x.m? Math.max(8, x.m/max*100) : 0, wr = x.r? Math.max(8, x.r/max*100) : 0;
    return `
    <div class="prow">
      <div class="pside l"><span class="pnum">${x.m||"·"}</span>${x.m?`<span class="pbar" style="width:${wm}%"></span>`:""}</div>
      <div class="plabel">${esc(x.t)}</div>
      <div class="pside r">${x.r?`<span class="pbar" style="width:${wr}%"></span>`:""}<span class="pnum">${x.r||"·"}</span></div>
    </div>`;
  }).join("")}</div>`;
}

async function openAttachment(id){
  const w = window.open("about:blank","_blank");   /* se abre ya, dentro del toque, para que no lo bloquee el navegador */
  try{
    let html = await idbGet(id);
    if(html==null) html = await fetchAttachment(id);
    if(html==null) throw new Error("no está");
    const url = URL.createObjectURL(new Blob([html], {type:"text/html;charset=utf-8"}));
    if(w){ w.location.href = url; } else { toast("El navegador bloqueó la pestaña nueva"); }
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ if(w) w.close(); toast("No encontré el archivo en este dispositivo"); }
}

  const full = buildGroups(cat).map(g=>g.key);

$("#app").addEventListener("pointerdown", e=>{
  const hd = e.target.closest(".mc-drag"); if(!hd) return;
  const card = hd.closest(".mcard"); if(!card) return;
  e.preventDefault();
  drag = {card, list:card.parentElement, hd, id:e.pointerId};
  card.classList.add("dragging");
  try{ hd.setPointerCapture(e.pointerId); }catch(_){}
});
$("#app").addEventListener("pointermove", e=>{
  if(!drag || e.pointerId!==drag.id) return;
  const y = e.clientY;
  const sibs = [...drag.list.children].filter(c=>c!==drag.card);
  let before = null;
  for(const s of sibs){ const r = s.getBoundingClientRect(); if(y < r.top + r.height/2){ before = s; break; } }
  if(before){ if(drag.card.nextSibling!==before) drag.list.insertBefore(drag.card, before); }
  else if(drag.list.lastElementChild!==drag.card) drag.list.appendChild(drag.card);
  if(y < 90) window.scrollBy(0,-14); else if(y > window.innerHeight-90) window.scrollBy(0,14);
});
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  drag.card.classList.remove("dragging");
  persistOrder(drag.list);
  drag = null; render();
}
$("#app").addEventListener("pointerup", endDrag);
$("#app").addEventListener("pointercancel", endDrag);
$("#app").addEventListener("keydown", e=>{
  const hd = e.target.closest && e.target.closest(".mc-drag"); if(!hd) return;
  if(e.key!=="ArrowUp" && e.key!=="ArrowDown") return;
  e.preventDefault();
  const card = hd.closest(".mcard"), list = card.parentElement;
  if(e.key==="ArrowUp" && card.previousElementSibling) list.insertBefore(card, card.previousElementSibling);
  else if(e.key==="ArrowDown" && card.nextElementSibling) list.insertBefore(card.nextElementSibling, card);
  else return;
  const key = card.dataset.key;
  persistOrder(list); render();
  const nh = document.querySelector(`.mcard[data-key="${CSS.escape(key)}"] .mc-drag`); if(nh) nh.focus();
});

function fmtBak(k){ const m = /^bak-(\d{4})(\d{2})(\d{2})(\d{2})$/.exec(k); if(!m) return k;
  const d = new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4])); return d.toLocaleString("es-UY",{timeZone:"America/Montevideo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
async function showBackups(){
  let wrap = document.getElementById("bakModal"); if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.id = "bakModal"; wrap.className = "bak-overlay";
  wrap.innerHTML = `<div class="bak-box"><h3>Recuperar etiquetas</h3><p class="bak-p">Elegí una copia anterior: se recuperan las etiquetas, notas y revisiones propias que hoy no estén en los goles. No borra nada de lo actual.</p><div id="bakList" class="bak-list">Buscando copias…</div>
  <div class="bak-foot"><button type="button" class="btn" id="bakFile">Usar un archivo .json…</button><button type="button" class="btn primary" id="bakClose">Cerrar</button></div></div>`;
  document.body.appendChild(wrap);
  $("#bakClose").onclick = ()=>wrap.remove();
  $("#bakFile").onclick = ()=>{ const i = document.createElement("input"); i.type="file"; i.accept="application/json,.json";
    i.onchange = async ()=>{ try{ const doc = JSON.parse(await i.files[0].text()); applyRescue(doc,"archivo"); wrap.remove(); }catch(e){ toast("No pude leer ese archivo"); } }; i.click(); };
  try{
    const r = await fetch("/api/backups",{cache:"no-store"}); const j = await r.json();
    const keys = (j.keys||[]).sort().reverse();
    $("#bakList").innerHTML = keys.length ? keys.map(k=>`<button type="button" class="bak-item" data-bak="${esc(k)}">${esc(fmtBak(k))}<span>Recuperar</span></button>`).join("") : "Todavía no hay copias en el servidor (se crean solas desde ahora, una por hora de uso).";
    $("#bakList").onclick = async e=>{ const b = e.target.closest("[data-bak]"); if(!b) return;
      try{ const r2 = await fetch("/api/backup/"+encodeURIComponent(b.dataset.bak),{cache:"no-store"}); const doc = await r2.json(); applyRescue(doc,"copia"); wrap.remove(); }catch(err){ toast("No pude abrir esa copia"); } };
  }catch(e){ $("#bakList").textContent = "No pude consultar las copias (sin conexión)."; }
}
function applyRescue(doc, what){
  const n = rescueTags(doc);
  if(n){ save(); render(); }
  toast(n ? `Recuperé etiquetas en ${n} goles desde la ${what}` : `La ${what} no tenía etiquetas distintas a las actuales`);
}

    ? (SYNC_ON ? "Los cambios se guardan y se comparten con los demás dispositivos (punto verde = sincronizado)." : "Los cambios se guardan automáticamente en esta vista.")
    : "Sin guardado automático acá: exportá para respaldar.";
  try{ if(localStorage.getItem("gc-admin")==="1") setAdmin(true); }catch(e){}
  render();
})();
</script>
